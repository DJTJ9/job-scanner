# Portal-Configs — Spike-Befunde 2026-07-09, Firecrawl-Ersatz 2026-07-11. LinkedIn: gesperrt. Xing: Phase 2.
- name: stepstone
  site: stepstone.de
  detail_url_pattern: 'stepstone\.de/stellenangebote--'
  search_type: html
  search_url_template: 'https://www.stepstone.de/jobs/{query}'
- name: arbeitsagentur
  site: arbeitsagentur.de
  detail_url_pattern: 'arbeitsagentur\.de/jobsuche/jobdetail/'
  search_type: api
- name: stellenanzeigen
  site: stellenanzeigen.de
  detail_url_pattern: 'stellenanzeigen\.de/job/'
  search_type: html
  search_url_template: 'https://www.stellenanzeigen.de/suche/?fulltext={query}'
- name: indeed
  site: de.indeed.com
  detail_url_pattern: 'de\.indeed\.com/(viewjob|rc/clk)'
  search_type: html
  search_url_template: 'https://de.indeed.com/jobs?q={query}'
