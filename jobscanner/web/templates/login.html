{% extends "base.html" %}
{% block title %}Login — Bob der Job-Bot{% endblock %}
{% block content %}
<div class="panel panel-narrow">
  <div class="hero-landscape-band"><img class="bob-avatar" src="/static/img/bob/bob-pose-winken.png" alt="Bob"></div>
  <h1><img class="bob-title" src="/static/img/bob/bob-pose-winken.png" alt=""> BOB DER JOB-BOT</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    {% include "_csrf_field.html" %}
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" required>
    <button type="submit" class="btn btn-primary">Anmelden</button>
  </form>
  <p><a class="link" href="/forgot-password">Passwort vergessen?</a></p>
  <p><a class="link" href="/register">Noch kein Konto? Registrieren</a></p>
</div>
{% endblock %}
