{% if p.status == "active" %}
<form method="post" action="/portale/deaktivieren/{{ p.id }}" style="display:inline">
  {% include "_csrf_field.html" %}
  <button type="submit" class="btn-secondary">Deaktivieren</button>
</form>
{% elif p.status == "inactive" %}
<form method="post" action="/portale/aktivieren/{{ p.id }}" style="display:inline">
  {% include "_csrf_field.html" %}
  <button type="submit" class="btn-primary">Reaktivieren</button>
</form>
{% endif %}
<form method="post" action="/portale/loeschen/{{ p.id }}" style="display:inline"
      onsubmit="return confirm('Portal für alle löschen?')">
  {% include "_csrf_field.html" %}
  <button type="submit" class="btn-secondary">Löschen</button>
</form>
