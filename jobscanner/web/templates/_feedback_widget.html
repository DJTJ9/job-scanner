<button type="button" class="feedback-fab" data-feedback-toggle aria-label="Feedback geben">💬</button>
<div class="panel feedback-panel panel-hidden" id="feedback-panel">
  <div class="feedback-panel-body">
    <h2>Sag's Bob</h2>
    <textarea class="feedback-textarea" data-feedback-text placeholder="Was ist los? Bug oder Idee?"></textarea>
    <button type="button" class="btn feedback-submit" data-feedback-submit>Absenden</button>
  </div>
  <button type="button" class="feedback-panel-close" data-feedback-close aria-label="Schließen">✕</button>
</div>
