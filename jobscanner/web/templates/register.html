{% extends "base.html" %}
{% block title %}Registrieren — Job-Scanner{% endblock %}
{% block content %}
<div class="panel panel-narrow">
  <h1>◈ Registrieren</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" required>
    <label for="invite_code">Invite-Code</label>
    <input type="text" id="invite_code" name="invite_code" required>
    <button type="submit" class="btn btn-primary">Konto anlegen</button>
  </form>
  <p><a class="link" href="/login">Schon registriert? Anmelden</a></p>
</div>
{% endblock %}
