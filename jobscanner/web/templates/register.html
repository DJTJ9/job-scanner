{% extends "base.html" %}
{% block title %}Registrieren — Bob der Job-Bot{% endblock %}
{% block content %}
<div class="panel panel-narrow">
  <div class="hero-landscape-band"><img class="bob-avatar" src="/static/img/bob/bob-pose-winken.png" alt="Bob"></div>
  <h1><img class="bob-title" src="/static/img/bob/bob-pose-winken.png" alt=""> Registrieren</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    {% include "_csrf_field.html" %}
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="username">Benutzername</label>
    <input type="text" id="username" name="username" required
           minlength="3" maxlength="20" pattern="[a-zA-Z0-9_-]+"
           placeholder="3–20 Zeichen, Buchstaben/Zahlen/_-">
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" required minlength="6">
    <label for="invite_code">Invite-Code</label>
    <input type="text" id="invite_code" name="invite_code" required>
    <label class="consent-label">
      <input type="checkbox" name="consent" required>
      Ich stimme der <a class="link" href="/datenschutz">Datenschutzerklärung</a> zu (Pflicht)
    </label>
    <button type="submit" class="btn btn-primary">Konto anlegen</button>
  </form>
  <p><a class="link" href="/login">Schon registriert? Anmelden</a></p>
</div>
{% endblock %}
