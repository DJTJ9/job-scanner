{% extends "base.html" %}
{% block title %}Profile — Job-Scanner{% endblock %}
{% block content %}
<h1>◈ JOB-SCANNER</h1>
<div class="panel">
  <h2>Profile</h2>
  {% for p in profiles %}
    <p><a class="link" href="/dashboard/{{ p.id }}">{{ p.name }}</a>{% if p.is_default %} (Standard){% endif %}</p>
  {% endfor %}
  <a class="btn btn-secondary" href="/wizard/new">+ Neues Profil</a>
</div>
{% endblock %}
