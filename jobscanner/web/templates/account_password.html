{% extends "base.html" %}
{% block title %}Passwort ändern — Bob der Job-Bot{% endblock %}
{% block content %}
<div class="panel panel-narrow logbuch">
  <a class="link" href="/">← Zurück</a>
  <h1>PASSWORT ÄNDERN</h1>
  <div class="tiefenlinie"></div>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if success %}<p class="success-msg">{{ success }}</p>{% endif %}
  <form method="post" action="/account/passwort">
    <label for="current_password">Aktuelles Passwort</label>
    <input type="password" id="current_password" name="current_password" required>
    <label for="new_password">Neues Passwort</label>
    <input type="password" id="new_password" name="new_password" required
           data-strength-input minlength="6">
    <div class="staerke-gauge" data-strength-gauge><span></span></div>
    <label for="new_password_repeat">Wiederholen</label>
    <input type="password" id="new_password_repeat" name="new_password_repeat" required>
    <button type="submit" class="btn btn-primary">Speichern</button>
  </form>
</div>
{% endblock %}
